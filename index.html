<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayalibit Bay Tourism</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #EDEAE3;
    --navy:       #1A2E3C;
    --gold:       #B8915A;
    --white:      #ffffff;
    --map-bg:     #D6DDE0;
    --icon-bg:    #EDEAE3;
    --border:     rgba(26, 46, 60, 0.09);
    --text-muted: rgba(26, 46, 60, 0.55);
    --text-sub:   rgba(26, 46, 60, 0.42);
    --shadow:     0 12px 50px rgba(26,46,60,.22), 0 3px 12px rgba(26,46,60,.10);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--navy);
  }

  /* ── TOPBAR ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 60px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    position: relative;
    z-index: 1000;
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .05em;
    color: var(--navy);
    line-height: 1.1;
  }
  .brand-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-style: italic;
    color: rgba(26,46,60,.48);
    letter-spacing: .03em;
  }
  nav { display: flex; align-items: center; }
  .nav-link {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--navy);
    opacity: .52;
    padding: 6px 16px;
    border: none;
    background: none;
    cursor: pointer;
    position: relative;
    letter-spacing: .01em;
    transition: opacity .2s;
    text-decoration: none;
  }
  .nav-link:hover { opacity: .8; }
  .nav-link.active { opacity: 1; font-weight: 500; }
  .nav-link.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 16px; right: 16px;
    height: 1.5px;
    background: var(--navy);
    border-radius: 1px;
  }
  .lang-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--navy);
    border: 0.5px solid rgba(26,46,60,.25);
    background: none;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: .06em;
    transition: background .15s;
  }
  .lang-btn:first-child { border-radius: 20px 0 0 20px; border-right: none; }
  .lang-btn:last-child  { border-radius: 0 20px 20px 0; }
  .lang-btn.active { background: var(--navy); color: var(--bg); }

  /* ── MAP ── */
  .map-wrap {
    position: relative;
    height: calc(100vh - 60px);
    background: var(--map-bg);
  }
  #leaflet-map {
    width: 100%;
    height: 100%;
  }

  /* Leaflet overrides */
  .leaflet-control-attribution {
    font-size: 9px;
    opacity: 0.45;
    background: rgba(255,255,255,.55) !important;
  }
  .leaflet-control-zoom a {
    color: var(--navy) !important;
    border-color: var(--border) !important;
  }

  /* ── VILLAGE PIN ── */
  .village-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .village-marker .v-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(26,46,60,.4);
    transition: transform .18s, background .18s;
  }
  .village-marker .v-stem {
    width: 1.5px;
    height: 7px;
    background: var(--gold);
    opacity: .7;
  }
  .village-marker:hover .v-dot,
  .village-marker.active .v-dot {
    background: var(--navy);
    transform: scale(1.4);
  }

  /* Village name label */
  .v-label {
    position: absolute;
    left: 14px;
    top: -6px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .04em;
    color: #1A2E3C;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
      -1px -1px 0 rgba(255,255,255,.9),
       1px -1px 0 rgba(255,255,255,.9),
      -1px  1px 0 rgba(255,255,255,.9),
       1px  1px 0 rgba(255,255,255,.9),
       0    2px 4px rgba(255,255,255,.7);
  }

  /* Hint pill */
  .hint-pill {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.88);
    border-radius: 30px;
    padding: 9px 20px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    border: 0.5px solid rgba(26,46,60,.08);
    pointer-events: none;
    z-index: 900;
    transition: opacity .3s;
  }

  /* ── FLOATING PANEL ── */
  .panel {
    position: absolute;
    top: 32px; right: 22px; bottom: 22px;
    width: 310px;
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity .25s, transform .25s;
    z-index: 900;
  }
  .panel.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(12px);
  }
  .panel-inner {
    padding: 28px 24px 0;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .panel-close {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: 0.5px solid var(--border);
    color: rgba(26,46,60,.35);
    cursor: pointer;
    display: flex;
    padding: 6px;
    border-radius: 8px;
    transition: background .15s;
  }
  .panel-close:hover { background: rgba(26,46,60,.05); }
  .panel-kicker {
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(26,46,60,.38);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .panel-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.3rem;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.02;
    margin-bottom: 10px;
  }
  .gold-bar {
    width: 28px; height: 1.5px;
    background: var(--gold);
    border-radius: 1px;
    margin-bottom: 14px;
  }
  .panel-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.72;
    margin-bottom: 16px;
    font-weight: 300;
  }
  .panel-contact {
    margin-bottom: 16px;
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .04em;
    cursor: pointer;
    text-decoration: none;
    margin-right: 8px;
    margin-bottom: 6px;
    transition: background .15s, color .15s;
  }
  .contact-btn:hover {
    background: var(--gold);
    color: #fff;
  }
  .act-list { display: flex; flex-direction: column; }
  .act-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(26,46,60,.07);
  }
  .act-row:first-child { border-top: 0.5px solid rgba(26,46,60,.07); }
  .act-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--icon-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--navy);
  }
  .act-name { font-size: 13px; font-weight: 500; color: var(--navy); line-height: 1.2; }
  .act-sub  { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-weight: 300; }

  .panel-photo {
    margin: 16px 12px 12px;
    border-radius: 10px;
    height: 120px;
    background: linear-gradient(140deg, #8aabb5, #5c8494);
    display: flex; align-items: flex-end;
    padding: 10px 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .panel-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(20,35,45,.45) 0%, transparent 60%);
  }
  .panel-photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .photo-label {
    font-size: 11px;
    color: rgba(255,255,255,.45);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body data-page="explore">

<header id="site-header"></header>

<div class="map-wrap">

  <div id="leaflet-map"></div>

  <div class="hint-pill" id="hint">
    <i data-lucide="hand-pointer" style="width:13px;height:13px"></i>
    Click on a village to discover more
  </div>

  <aside class="panel hidden" id="panel">
    <button class="panel-close" id="panel-close">
      <i data-lucide="x" style="width:15px;height:15px"></i>
    </button>
    <div class="panel-inner">
      <div class="panel-kicker">Village</div>
      <div class="panel-name" id="panel-name"></div>
      <div class="gold-bar"></div>
      <div class="panel-desc" id="panel-desc"></div>
      <div class="panel-contact" id="panel-contact"></div>
      <div class="act-list" id="act-list"></div>
    </div>
    <div class="panel-photo" id="panel-photo">
      <span class="photo-label">Village photo</span>
    </div>
  </aside>

</div>

<script>
// ── Village data ─────────────────────────────────────────────────────
const villages = {
  go: {
    name: "Go",
    lat: -0.0784895, lon: 130.6647536,
    desc: "A lively village at the bay's southern entrance – snorkel crystal-clear waters, kayak by traditional canoe, spot dolphins, explore waterfalls and mangroves, and visit local weavers onshore.\n\nDesa Go di pintu masuk selatan teluk menawarkan snorkeling, kayak dengan perahu tradisional, pengamatan lumba-lumba, air terjun, dan jelajah mangrove – serta kunjungan ke pengrajin anyaman lokal.",
    activities: [
      { icon: "trees",      name: "Forest Walks",   sub: "Hutan · Jalan alam" },
      { icon: "fish",       name: "Fishing",        sub: "Memancing · Fishing" },
      { icon: "binoculars", name: "Bird Watching",  sub: "Tem mani · Pengamatan burung" },
    ],
    photo: null
  },
  kabilol: {
    name: "Kabilol",
    lat: -0.1135379, lon: 130.6411137,
    desc: "A secluded village known for its mangrove forests and traditional canoe building craftsmanship.",
    activities: [
      { icon: "sailboat",   name: "Canoe Building", sub: "Perahu · Kerajinan" },
      { icon: "leaf",       name: "Mangrove Tour",  sub: "Bakau · Wisata alam" },
      { icon: "fish",       name: "Fishing",        sub: "Memancing · Fishing" },
    ],
    photo: null
  },
  arawai: {
    name: "Arawai",
    lat: -0.1496432, lon: 130.6267899,
    desc: "Gateway village on the western bay shores, surrounded by pristine jungle and rich marine life.",
    activities: [
      { icon: "waves",      name: "Snorkeling",     sub: "Menyelam · Snorkeling" },
      { icon: "trees",      name: "Nature Walks",   sub: "Alam · Jalan alam" },
      { icon: "anchor",     name: "Boat Tours",     sub: "Perahu · Tour laut" },
    ],
    photo: null
  },
  beo: {
    name: "Beo",
    lat: -0.1367313, lon: 130.6813954,
    desc: "A small community in the heart of Mayalibit Bay with access to traditional craft weaving and jungle trails.",
    activities: [
      { icon: "footprints", name: "Jungle Trekking",sub: "Hutan · Pendakian" },
      { icon: "music",      name: "Cultural Events",sub: "Budaya · Adat" },
      { icon: "waves",      name: "Snorkeling",     sub: "Menyelam · Snorkeling" },
    ],
    photo: null
  },
  waifoi: {
    name: "Waifoi",
    lat: -0.1002787, lon: 130.7141854,
    desc: "Waifoi is the cultural heart of Mayalibit Bay – home to a Ma'ya ancestral house, traditional sago processing, and the Makai Hun Hat cultural stage. The surrounding forest and mangroves shelter rich wildlife, from amphibians to endemic birds.\n\nWaifoi adalah jantung budaya Teluk Mayalibit – dengan rumah adat Ma'ya, pengolahan sagu tradisional, dan sanggar budaya Makai Hun Hat. Hutan dan mangrove di sekitarnya menjadi habitat satwa liar yang kaya.",
    activities: [
      { icon: "binoculars", name: "Bird Watching",  sub: "Tem mani · Pengamatan burung" },
      { icon: "trees",      name: "Forest Trekking",sub: "Hutan · Pendakian hutan" },
      { icon: "sailboat",   name: "Canoe Trips",    sub: "Perahu · Kayak" },
    ],
    photo: null
  },
  warimak: {
    name: "Warimak",
    lat: -0.1453863, lon: 130.7363123,
    desc: "Remote and unhurried, Warimak rewards adventurous visitors with jungle trekking, cave exploration, and exceptional birdwatching amid untouched forest rich in flora and fauna.\n\nTerpencil dan tenang, Warimak menawarkan trekking hutan, jelajah goa, dan pengamatan burung yang luar biasa di tengah hutan yang kaya flora dan fauna.",
    activities: [
      { icon: "house",      name: "Homestay",       sub: "Nowtato · Homestay" },
      { icon: "binoculars", name: "Bird Watching",  sub: "Tem mani · Pengamatan burung" },
      { icon: "footprints", name: "Hiking",         sub: "Sa · Lintas alam" },
    ],
    photo: null,
    contact: { label: "Laensorongga Homestay", url: "https://maps.app.goo.gl/bXheh3oXwJmD9bFKA", phone: null }
  },
  kalitoko: {
    name: "Kalitoko",
    lat: -0.2240712, lon: 130.8025038,
    desc: "Kalitoko sits deep in the bay, where rivers meet mangroves and the forest begins. Ideal for slow travel – trekking, river exploration, and quiet encounters with wildlife.\n\nKalitoko terletak jauh di dalam teluk, di mana sungai bertemu mangrove dan hutan dimulai. Cocok untuk perjalanan santai – trekking, jelajah sungai, dan pengamatan satwa.",
    activities: [
      { icon: "fish",       name: "Lobster Farm Tour",sub: "Budidaya · Farm tour" },
      { icon: "waves",      name: "Snorkeling",       sub: "Menyelam · Diving" },
      { icon: "anchor",     name: "Fishing",          sub: "Memancing · Fishing" },
    ],
    photo: null,
    contact: { label: "Labuta Homestay", url: "https://www.instagram.com/labutahomstey/", phone: null }
  },
  warsambin: {
    name: "Warsambin",
    lat: -0.3188912, lon: 130.9188419,
    desc: "Warsambin welcomes visitors with traditional dance and the striking blue waters of Kalibiru. The village is also a gateway to mangrove jetty exploration along the bay's eastern shore.\n\nWarsambin menyambut tamu dengan tarian tradisional dan air biru Kalibiru yang memukau. Desa ini juga menjadi pintu masuk untuk menjelajahi jeti mangrove di pesisir timur teluk.",
    activities: [
      { icon: "sailboat",   name: "Canoe Tours",    sub: "Perahu · Kayak" },
      { icon: "leaf",       name: "Nature Walks",   sub: "Alam · Jalan alam" },
      { icon: "anchor",     name: "Fishing",        sub: "Memancing · Fishing" },
    ],
    photo: null
  },
  lopintol: {
    name: "Lopintol",
    lat: -0.3164116, lon: 130.8954175,
    desc: "A small fishing community known for traditional weaving and pristine coral reef snorkeling.",
    activities: [
      { icon: "waves",      name: "Snorkeling",        sub: "Menyelam · Diving" },
      { icon: "compass",    name: "Guided Walks",      sub: "Jalan · Panduan alam" },
      { icon: "music",      name: "Traditional Music", sub: "Musik adat · Music" },
    ],
    photo: null
  },
  mumes: {
    name: "Mumes",
    lat: -0.305, lon: 130.940,
    desc: "Mumes lies at the northern tip of the bay, offering a quiet base for those seeking seclusion – with glamping options and homestays amid pristine nature.\n\nMumes terletak di ujung utara teluk, menawarkan ketenangan bagi mereka yang mencari kedamaian – dengan pilihan glamping dan homestay di alam yang masih asri.",
    activities: [
      { icon: "waves",      name: "Diving",         sub: "Menyelam · Diving" },
      { icon: "fish",       name: "Fishing",        sub: "Memancing · Fishing" },
      { icon: "compass",    name: "Guided Tours",   sub: "Panduan · Tour" },
    ],
    photo: null
  },
};

// ── Leaflet map ──────────────────────────────────────────────────────
const map = L.map('leaflet-map', {
  zoomControl: true,
  scrollWheelZoom: true,
  attributionControl: true,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  maxZoom: 18,
  subdomains: 'abcd',
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
}).addTo(map);

map.fitBounds([
  [-0.3433, 130.5739],
  [-0.0247, 130.9611]
], { padding: [24, 24] });

// ── Panel logic ──────────────────────────────────────────────────────
const panel      = document.getElementById('panel');
const panelName  = document.getElementById('panel-name');
const panelDesc  = document.getElementById('panel-desc');
const actList    = document.getElementById('act-list');
const panelContact = document.getElementById('panel-contact');
const panelPhoto = document.getElementById('panel-photo');
const hint       = document.getElementById('hint');

function openVillage(id) {
  const v = villages[id];
  if (!v) return;

  panelName.textContent = v.name;
  panelDesc.textContent = v.desc;

  if (v.contact) {
    let html = '';
    if (v.contact.url) {
      html += `<a class="contact-btn" href="${v.contact.url}" target="_blank" rel="noopener">
        <i data-lucide="external-link" style="width:13px;height:13px"></i>${v.contact.label}
      </a>`;
    }
    if (v.contact.phone) {
      html += `<a class="contact-btn" href="https://wa.me/${v.contact.phone.replace(/\D/g,'')}" target="_blank" rel="noopener">
        <i data-lucide="message-circle" style="width:13px;height:13px"></i>WhatsApp
      </a>`;
    }
    panelContact.innerHTML = html;
    panelContact.style.display = 'block';
  } else {
    panelContact.innerHTML = '';
    panelContact.style.display = 'none';
  }

  actList.innerHTML = v.activities.map(a => `
    <div class="act-row">
      <div class="act-icon"><i data-lucide="${a.icon}" style="width:16px;height:16px"></i></div>
      <div>
        <div class="act-name">${a.name}</div>
        <div class="act-sub">${a.sub}</div>
      </div>
    </div>
  `).join('');

  if (v.photo) {
    panelPhoto.innerHTML = `<img src="${v.photo}" alt="${v.name}"><span class="photo-label" style="position:relative;z-index:1;font-size:11px;color:rgba(255,255,255,.45);font-style:italic;font-family:'Cormorant Garamond',serif;">${v.name}</span>`;
  } else {
    panelPhoto.innerHTML = `<span class="photo-label">Village photo</span>`;
  }

  panel.classList.remove('hidden');
  hint.style.opacity = '0';
  lucide.createIcons();

  document.querySelectorAll('.village-marker').forEach(m => m.classList.remove('active'));
  const el = document.getElementById('marker-' + id);
  if (el) el.classList.add('active');
}

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.add('hidden');
  hint.style.opacity = '1';
  document.querySelectorAll('.village-marker').forEach(m => m.classList.remove('active'));
});

// ── Place markers ────────────────────────────────────────────────────
Object.entries(villages).forEach(([id, v]) => {
  // Custom pin icon
  const icon = L.divIcon({
    className: '',
    html: `<div class="village-marker" id="marker-${id}">
             <div class="v-dot"></div>
             <div class="v-stem"></div>
             <div class="v-label">${v.name}</div>
           </div>`,
    iconSize: [11, 18],
    iconAnchor: [5, 18],
  });

  const marker = L.marker([v.lat, v.lon], { icon }).addTo(map);

  marker.on('click', () => openVillage(id));
});

// ── Init ─────────────────────────────────────────────────────────────
lucide.createIcons();
</script>
<script src="header.js"></script>
</body>
</html>
