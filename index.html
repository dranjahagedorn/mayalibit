<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayalibit Bay · Tourist Activities · Aktivitas Wisata Teluk Mayalibit</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">MAYALIBIT BAY</div>
    <div class="logo-sub">Reef Guardian e.V.</div>
  </div>
  <nav class="main-nav">
    <a href="#" class="nav-link active" data-i18n="nav_explore">Explore</a>
    <a href="#" class="nav-link" data-i18n="nav_villages">Villages</a>
    <a href="#" class="nav-link" data-i18n="nav_activities">Activities</a>
  </nav>
  <div class="header-right">
    <button class="lang-btn" id="lang-toggle">ID</button>
    <div class="tag">Reef Guardian e.V.</div>
  </div>
</header>

<div class="map-outer">
  <div class="map-container">
    <img src="mayalibit-map.png" alt="Tourist Activities of Mayalibit Bay">

    <div class="hotspot" style="left:36.5%; top:24.5%" data-loc="go"></div>
    <div class="hotspot" style="left:27.8%; top:36.5%" data-loc="kabilol"></div>
    <div class="hotspot" style="left:51.8%; top:29.5%" data-loc="waifoi"></div>
    <div class="hotspot" style="left:38.8%; top:43.5%" data-loc="beo"></div>
    <div class="hotspot" style="left:23.2%; top:46.0%" data-loc="arawai"></div>
    <div class="hotspot" style="left:54.5%; top:44.0%" data-loc="warimak"></div>
    <div class="hotspot" style="left:62.8%; top:65.0%" data-loc="kalitoko"></div>
    <div class="hotspot" style="left:72.0%; top:78.5%" data-loc="warsambin"></div>
    <div class="hotspot" style="left:73.2%; top:89.5%" data-loc="lopintol"></div>
    <div class="hotspot" style="left:88.5%; top:84.5%" data-loc="mumes"></div>

    <!-- Hint overlay on map -->
    <div class="map-hint" id="map-hint">
      <span class="map-hint-icon">☞</span>
      <span data-i18n="hint">Click on a village to discover more</span>
    </div>
  </div>
</div>

<!-- Tooltip (hover) -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-desc" id="tt-desc"></div>
  <div id="tt-activities"></div>
</div>

<!-- Detail Panel (click) -->
<aside class="detail-panel" id="detail-panel">
  <button class="detail-close" id="detail-close" aria-label="Close">×</button>
  <div class="detail-kicker" data-i18n="kicker">Village</div>
  <h2 id="detail-name"></h2>
  <div class="detail-divider"></div>
  <p id="detail-desc"></p>
  <div id="detail-activities"></div>
  <!-- Photo slot: add src="photos/villagename.jpg" when available -->
  <div class="detail-photo" id="detail-photo"></div>
</aside>

<script>
/* =====================================================
   I18N – Translations
   ===================================================== */
const i18n = {
  en: {
    nav_explore:   "Explore",
    nav_villages:  "Villages",
    nav_activities:"Activities",
    hint:          "Click on a village to discover more",
    kicker:        "Village",
    no_desc:       "Explore local activities, village life, and nature-based experiences in Mayalibit Bay.",
  },
  id: {
    nav_explore:   "Jelajahi",
    nav_villages:  "Desa",
    nav_activities:"Aktivitas",
    hint:          "Klik desa untuk menemukan lebih banyak",
    kicker:        "Desa",
    no_desc:       "Temukan aktivitas lokal, kehidupan desa, dan pengalaman berbasis alam di Teluk Mayalibit.",
  }
};

let lang = "en";

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.getElementById('lang-toggle').textContent = lang === 'en' ? 'ID' : 'EN';
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  lang = lang === 'en' ? 'id' : 'en';
  applyLang();
});

/* =====================================================
   LOCATION DATA
   =====================================================
   Für jeden Ort:
   - name_en / name_id: Ortsname (beide gleich hier)
   - desc_en: Englische Beschreibung (1–3 Sätze)
   - desc_id: Indonesische Beschreibung
   - photo: Dateiname des Fotos (z.B. "waifoi.jpg") – leer lassen wenn noch kein Foto
   - activities: Icon, englischer Name, Ambel · Indonesisch
   ===================================================== */
const data = {
  go: {
    name_en: "Go", name_id: "Go",
    // ↓ Beschreibung EN:
    desc_en: "",
    // ↓ Beschreibung ID:
    desc_id: "",
    // ↓ Foto-Dateiname (in photos/ Ordner ablegen):
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  kabilol: {
    name_en: "Kabilol", name_id: "Kabilol",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  waifoi: {
    name_en: "Waifoi", name_id: "Waifoi",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay",         sub: "Nowtato · Homestay" },
      { icon: "🦜", name: "Bird Watching",     sub: "Tem mani · Pengamatan burung" },
      { icon: "🥾", name: "Hiking",            sub: "Sa · Lintas alam" },
      { icon: "🥁", name: "Cultural Heritage", sub: "Le imtolon · Warisan budaya" }
    ]
  },
  beo: {
    name_en: "Beo", name_id: "Beo",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  arawai: {
    name_en: "Arawai", name_id: "Arawai",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay",  sub: "Nowtato · Homestay" },
      { icon: "🔭", name: "Viewpoint", sub: "Iyamunta tem · Gardu Pandang" }
    ]
  },
  warimak: {
    name_en: "Warimak", name_id: "Warimak",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay",      sub: "Nowtato · Homestay" },
      { icon: "🦜", name: "Bird Watching", sub: "Tem mani · Pengamatan burung" },
      { icon: "🥾", name: "Hiking",        sub: "Sa · Lintas alam" }
    ]
  },
  kalitoko: {
    name_en: "Kalitoko", name_id: "Kalitoko",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  warsambin: {
    name_en: "Warsambin", name_id: "Warsambin",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay",             sub: "Nowtato · Homestay" },
      { icon: "🏊", name: "Swimming – Kali Biru", sub: "Hla · Berenang" }
    ]
  },
  lopintol: {
    name_en: "Lopintol", name_id: "Lopintol",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay",   sub: "Nowtato · Homestay" },
      { icon: "🤿", name: "Snorkeling", sub: "Hlanaron · Snorkeling" }
    ]
  },
  mumes: {
    name_en: "Mumes", name_id: "Mumes",
    desc_en: "",
    desc_id: "",
    photo: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  }
};

/* =====================================================
   INTERACTION
   ===================================================== */
const tooltip       = document.getElementById('tooltip');
const ttName        = document.getElementById('tt-name');
const ttDesc        = document.getElementById('tt-desc');
const ttAct         = document.getElementById('tt-activities');
const detailPanel   = document.getElementById('detail-panel');
const detailClose   = document.getElementById('detail-close');
const detailName    = document.getElementById('detail-name');
const detailDesc    = document.getElementById('detail-desc');
const detailAct     = document.getElementById('detail-activities');
const detailPhoto   = document.getElementById('detail-photo');
const mapHint       = document.getElementById('map-hint');

function activityHTML(a) {
  return `
    <div class="tooltip-activity">
      <div class="act-icon">${a.icon}</div>
      <div class="act-text">
        <strong>${a.name}</strong>
        <small>${a.sub}</small>
      </div>
    </div>`;
}

document.querySelectorAll('.hotspot').forEach(hs => {

  // Hover → tooltip
  hs.addEventListener('mouseenter', function(e) {
    const loc = data[this.dataset.loc];
    if (!loc) return;
    ttName.textContent = loc[`name_${lang}`];
    ttDesc.textContent = loc[`desc_${lang}`] || '';
    ttAct.innerHTML = loc.activities.map(activityHTML).join('');
    tooltip.classList.add('visible');
    moveTooltip(e);
  });
  hs.addEventListener('mousemove', moveTooltip);
  hs.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));

  // Click → detail panel
  hs.addEventListener('click', function() {
    const loc = data[this.dataset.loc];
    if (!loc) return;

    detailName.textContent = loc[`name_${lang}`];
    detailDesc.textContent = loc[`desc_${lang}`] || i18n[lang].no_desc;
    detailAct.innerHTML = loc.activities.map(activityHTML).join('');

    // Photo
    if (loc.photo) {
      detailPhoto.innerHTML = `<img src="photos/${loc.photo}" alt="${loc[`name_${lang}`]}">`;
      detailPhoto.style.display = 'block';
    } else {
      detailPhoto.innerHTML = '';
      detailPhoto.style.display = 'none';
    }

    detailPanel.classList.add('visible');
    mapHint.style.display = 'none';
    tooltip.classList.remove('visible');
  });
});

detailClose.addEventListener('click', () => {
  detailPanel.classList.remove('visible');
  mapHint.style.display = 'flex';
});

function moveTooltip(e) {
  const w = tooltip.offsetWidth  || 250;
  const h = tooltip.offsetHeight || 160;
  let x = e.clientX + 18;
  let y = e.clientY - 20;
  if (x + w > window.innerWidth  - 8) x = e.clientX - w - 18;
  if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

// Init
applyLang();
</script>
</body>
</html>
