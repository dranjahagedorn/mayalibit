<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayalibit Bay · Tourist Activities · Aktivitas Wisata Teluk Mayalibit</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
</head>
<body>

<div class="map-wrap"><img id="map-img" src="mayalibit-map.png" alt="Mayalibit Bay"></div>

<header>
  <div>
    <div class="brand-name">Mayalibit Bay</div>
    <div class="brand-sub">Reef Guardian e.V.</div>
  </div>
  <nav>
    <a href="#" class="nav-link active" data-i18n="nav_explore">Explore</a>
    <a href="#" class="nav-link" data-i18n="nav_villages">Villages</a>
    <a href="#" class="nav-link" data-i18n="nav_activities">Activities</a>
    <a href="#" class="nav-link" data-i18n="nav_about">About</a>
    <a href="#" class="nav-link" data-i18n="nav_conservation">Conservation</a>
  </nav>
  <div class="header-right">
    <button class="lang-btn" id="lang-btn">ID</button>
    <div class="rg-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      Reef Guardian e.V.
    </div>
    <button class="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="map-hint" id="map-hint">
  <span>👆</span><span data-i18n="hint">Click on a village to discover more</span>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-acts" id="tt-acts"></div>
</div>

<aside class="detail-panel" id="detail-panel">
  <button class="panel-close" id="panel-close">×</button>
  <div class="panel-kicker" data-i18n="kicker">Village</div>
  <div class="panel-name" id="panel-name"></div>
  <div class="panel-divider"></div>
  <p class="panel-desc" id="panel-desc"></p>
  <div class="panel-acts" id="panel-acts"></div>
  <div class="panel-photo" id="panel-photo"></div>
</aside>

<script>
/* ── I18N ── */
const i18n = {
  en: { nav_explore:"Explore", nav_villages:"Villages", nav_activities:"Activities", nav_about:"About", nav_conservation:"Conservation", hint:"Click on a village to discover more", kicker:"Village", no_desc:"Explore village life and nature-based experiences in Mayalibit Bay." },
  id: { nav_explore:"Jelajahi", nav_villages:"Desa", nav_activities:"Aktivitas", nav_about:"Tentang", nav_conservation:"Konservasi", hint:"Klik desa untuk menemukan lebih banyak", kicker:"Desa", no_desc:"Temukan kehidupan desa dan pengalaman alam di Teluk Mayalibit." }
};
let lang = "en";
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const k=el.dataset.i18n; if(i18n[lang][k]) el.textContent=i18n[lang][k]; });
  document.getElementById('lang-btn').textContent = lang==='en'?'ID':'EN';
  document.querySelectorAll('.map-label').forEach(lb => { const loc=locations.find(l=>l.id===lb.dataset.locId); if(loc) lb.textContent=loc[`name_${lang}`]; });
}
document.getElementById('lang-btn').addEventListener('click',()=>{ lang=lang==='en'?'id':'en'; applyLang(); });

/* ── LOCATION DATA ──────────────────────────────────────
   desc_en / desc_id : Ortsbeschreibung eintragen
   photo             : Dateiname in photos/ Ordner, z.B. "waifoi.jpg"
─────────────────────────────────────────────────────── */
const locations = [
  { id:"go",        name_en:"Go",        name_id:"Go",        left:36.5, top:24.5, lx:12,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"}] },
  { id:"kabilol",   name_en:"Kabilol",   name_id:"Kabilol",   left:27.8, top:36.5, lx:-76, ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"}] },
  { id:"waifoi",    name_en:"Waifoi",    name_id:"Waifoi",    left:51.8, top:29.5, lx:14,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"},{icon:"🦜",name:"Bird Watching",sub:"Tem mani · Pengamatan burung"},{icon:"🥾",name:"Hiking",sub:"Sa · Lintas alam"},{icon:"🥁",name:"Cultural Heritage",sub:"Le imtolon · Warisan budaya"}] },
  { id:"beo",       name_en:"Beo",       name_id:"Beo",       left:38.8, top:43.5, lx:14,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"}] },
  { id:"arawai",    name_en:"Arawai",    name_id:"Arawai",    left:23.2, top:46.0, lx:-70, ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"},{icon:"🔭",name:"Viewpoint",sub:"Iyamunta tem · Gardu Pandang"}] },
  { id:"warimak",   name_en:"Warimak",   name_id:"Warimak",   left:54.5, top:44.0, lx:14,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"},{icon:"🦜",name:"Bird Watching",sub:"Tem mani · Pengamatan burung"},{icon:"🥾",name:"Hiking",sub:"Sa · Lintas alam"}] },
  { id:"kalitoko",  name_en:"Kalitoko",  name_id:"Kalitoko",  left:62.8, top:65.0, lx:14,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"}] },
  { id:"warsambin", name_en:"Warsambin", name_id:"Warsambin", left:72.0, top:78.5, lx:-86, ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"},{icon:"🏊",name:"Swimming – Kali Biru",sub:"Hla · Berenang"}] },
  { id:"lopintol",  name_en:"Lopintol",  name_id:"Lopintol",  left:73.2, top:89.5, lx:-82, ly:14,  desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"},{icon:"🤿",name:"Snorkeling",sub:"Hlanaron · Snorkeling"}] },
  { id:"mumes",     name_en:"Mumes",     name_id:"Mumes",     left:88.5, top:84.5, lx:14,  ly:-22, desc_en:"", desc_id:"", photo:"", activities:[{icon:"🏡",name:"Homestay",sub:"Nowtato · Homestay"}] }
];

/* ── BUILD HOTSPOTS ── */
const mapImg = document.getElementById('map-img');
function build() {
  document.querySelectorAll('.hotspot,.map-label').forEach(e=>e.remove());
  const r = mapImg.getBoundingClientRect();
  locations.forEach(loc => {
    const x = r.left + (loc.left/100)*r.width;
    const y = r.top  + (loc.top/100)*r.height;
    const hs = document.createElement('div');
    hs.className='hotspot'; hs.dataset.id=loc.id;
    hs.style.left=x+'px'; hs.style.top=y+'px';
    document.body.appendChild(hs);
    const lb = document.createElement('div');
    lb.className='map-label'; lb.dataset.locId=loc.id;
    lb.textContent=loc[`name_${lang}`];
    lb.style.left=(x+loc.lx)+'px'; lb.style.top=(y+loc.ly)+'px';
    document.body.appendChild(lb);
    hs.addEventListener('mouseenter',e=>showTip(loc,e));
    hs.addEventListener('mousemove',moveTip);
    hs.addEventListener('mouseleave',hideTip);
    hs.addEventListener('click',()=>openPanel(loc));
  });
}
window.addEventListener('resize',build);
if(mapImg.complete) build(); else mapImg.addEventListener('load',build);

/* ── TOOLTIP ── */
const tooltip=document.getElementById('tooltip'), ttName=document.getElementById('tt-name'), ttActs=document.getElementById('tt-acts');
function showTip(loc,e){ ttName.textContent=loc[`name_${lang}`]; ttActs.innerHTML=loc.activities.map(a=>`<div class="tt-act"><div class="tt-act-icon">${a.icon}</div><span>${a.name}</span></div>`).join(''); tooltip.classList.add('visible'); moveTip(e); }
function hideTip(){ tooltip.classList.remove('visible'); }
function moveTip(e){ const w=tooltip.offsetWidth||200,h=tooltip.offsetHeight||100; let x=e.clientX+16,y=e.clientY-12; if(x+w>window.innerWidth-8)x=e.clientX-w-16; if(y+h>window.innerHeight-8)y=window.innerHeight-h-8; if(y<8)y=8; tooltip.style.left=x+'px'; tooltip.style.top=y+'px'; }

/* ── DETAIL PANEL ── */
const panel=document.getElementById('detail-panel'), panelName=document.getElementById('panel-name'), panelDesc=document.getElementById('panel-desc'), panelActs=document.getElementById('panel-acts'), panelPhoto=document.getElementById('panel-photo'), mapHint=document.getElementById('map-hint');
function openPanel(loc){
  panelName.textContent=loc[`name_${lang}`];
  panelDesc.textContent=loc[`desc_${lang}`]||i18n[lang].no_desc;
  panelActs.innerHTML=loc.activities.map(a=>`
    <div class="panel-act">
      <div class="panel-act-icon">${a.icon}</div>
      <div>
        <span class="panel-act-name">${a.name}</span>
        <span class="panel-act-sub">${a.sub}</span>
      </div>
    </div>`).join('');
  if(loc.photo){ panelPhoto.innerHTML=`<img src="photos/${loc.photo}" alt="${loc[`name_${lang}`]}">`; panelPhoto.style.display='block'; }
  else { panelPhoto.innerHTML=''; panelPhoto.style.display='none'; }
  document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active'));
  document.querySelector(`.hotspot[data-id="${loc.id}"]`)?.classList.add('active');
  panel.classList.add('open'); mapHint.classList.add('hidden'); hideTip();
}
document.getElementById('panel-close').addEventListener('click',()=>{ panel.classList.remove('open'); mapHint.classList.remove('hidden'); document.querySelectorAll('.hotspot').forEach(h=>h.classList.remove('active')); });

applyLang();
</script>
</body>
</html>
