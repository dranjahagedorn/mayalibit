<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayalibit Bay Tourism</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #EDEAE3;
    --navy:       #1A2E3C;
    --gold:       #B8915A;
    --white:      #ffffff;
    --map-bg:     #D6DDE0;
    --icon-bg:    #EDEAE3;
    --border:     rgba(26, 46, 60, 0.09);
    --text-muted: rgba(26, 46, 60, 0.55);
    --text-sub:   rgba(26, 46, 60, 0.42);
    --shadow:     0 12px 50px rgba(26,46,60,.22), 0 3px 12px rgba(26,46,60,.10);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--navy);
  }

  /* ── TOPBAR ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 60px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    position: relative;
    z-index: 1000;
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .05em;
    color: var(--navy);
    line-height: 1.1;
  }
  .brand-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    font-style: italic;
    color: rgba(26,46,60,.48);
    letter-spacing: .03em;
  }
  nav { display: flex; align-items: center; }
  .nav-link {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--navy);
    opacity: .52;
    padding: 6px 16px;
    border: none;
    background: none;
    cursor: pointer;
    position: relative;
    letter-spacing: .01em;
    transition: opacity .2s;
    text-decoration: none;
  }
  .nav-link:hover { opacity: .8; }
  .nav-link.active { opacity: 1; font-weight: 500; }
  .nav-link.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 16px; right: 16px;
    height: 1.5px;
    background: var(--navy);
    border-radius: 1px;
  }
  .lang-btn {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--navy);
    border: 0.5px solid rgba(26,46,60,.25);
    background: none;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: .06em;
    transition: background .15s;
  }
  .lang-btn:first-child { border-radius: 20px 0 0 20px; border-right: none; }
  .lang-btn:last-child  { border-radius: 0 20px 20px 0; }
  .lang-btn.active { background: var(--navy); color: var(--bg); }

  /* ── MAP ── */
  .map-wrap {
    position: relative;
    height: calc(100vh - 60px);
    background: var(--map-bg);
  }
  #leaflet-map {
    width: 100%;
    height: 100%;
  }

  /* Leaflet overrides */
  .leaflet-control-attribution {
    font-size: 9px;
    opacity: 0.45;
    background: rgba(255,255,255,.55) !important;
  }
  .leaflet-control-zoom a {
    color: var(--navy) !important;
    border-color: var(--border) !important;
  }

  /* ── VILLAGE PIN ── */
  .village-marker {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .village-marker .v-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid white;
    box-shadow: 0 2px 8px rgba(26,46,60,.4);
    transition: transform .18s, background .18s;
  }
  .village-marker .v-stem {
    width: 1.5px;
    height: 7px;
    background: var(--gold);
    opacity: .7;
  }
  .village-marker:hover .v-dot,
  .village-marker.active .v-dot {
    background: var(--navy);
    transform: scale(1.4);
  }

  /* Village name label */
  .v-label {
    position: absolute;
    left: 14px;
    top: -6px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .04em;
    color: #1A2E3C;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
      -1px -1px 0 rgba(255,255,255,.9),
       1px -1px 0 rgba(255,255,255,.9),
      -1px  1px 0 rgba(255,255,255,.9),
       1px  1px 0 rgba(255,255,255,.9),
       0    2px 4px rgba(255,255,255,.7);
  }


  /* ── DEKO MARKERS ── */
  .deko-marker { pointer-events: none; }
  .deko-label {
    position: absolute;
    left: 18px; top: -7px;
    font-family: 'Inter', sans-serif;
    font-size: 10px; font-weight: 400;
    letter-spacing: .04em;
    color: rgba(26,46,60,.55);
    white-space: nowrap;
    text-shadow:
      -1px -1px 0 rgba(255,255,255,.85),
       1px -1px 0 rgba(255,255,255,.85),
      -1px  1px 0 rgba(255,255,255,.85),
       1px  1px 0 rgba(255,255,255,.85);
  }
  .deko-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(26,46,60,.28);
    border: 1.5px solid rgba(255,255,255,.8);
  }
  .deko-mountain {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid rgba(26,46,60,.35);
  }
  .deko-snorkel {
    font-size: 14px;
    line-height: 1;
    filter: opacity(0.55);
  }

  /* Hint pill */
  .hint-pill {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,.88);
    border-radius: 30px;
    padding: 9px 20px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    border: 0.5px solid rgba(26,46,60,.08);
    pointer-events: none;
    z-index: 900;
    transition: opacity .3s;
  }

  /* ── FLOATING PANEL ── */
  .panel {
    position: absolute;
    top: 32px; right: 22px; bottom: 22px;
    width: 310px;
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity .25s, transform .25s;
    z-index: 900;
  }
  .panel.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(12px);
  }
  .panel-inner {
    padding: 28px 24px 0;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .panel-close {
    position: absolute;
    top: 14px; right: 14px;
    background: none;
    border: 0.5px solid var(--border);
    color: rgba(26,46,60,.35);
    cursor: pointer;
    display: flex;
    padding: 6px;
    border-radius: 8px;
    transition: background .15s;
  }
  .panel-close:hover { background: rgba(26,46,60,.05); }
  .panel-kicker {
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(26,46,60,.38);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .panel-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.3rem;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.02;
    margin-bottom: 10px;
  }
  .gold-bar {
    width: 28px; height: 1.5px;
    background: var(--gold);
    border-radius: 1px;
    margin-bottom: 14px;
  }
  .panel-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.72;
    margin-bottom: 16px;
    font-weight: 300;
  }
  .panel-contact {
    margin-bottom: 16px;
  }
  .contact-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .04em;
    cursor: pointer;
    text-decoration: none;
    margin-right: 8px;
    margin-bottom: 6px;
    transition: background .15s, color .15s;
  }
  .contact-btn:hover {
    background: var(--gold);
    color: #fff;
  }
  .act-list { display: flex; flex-direction: column; }
  .act-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(26,46,60,.07);
  }
  .act-row:first-child { border-top: 0.5px solid rgba(26,46,60,.07); }
  .act-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--icon-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--navy);
  }
  .act-name { font-size: 13px; font-weight: 500; color: var(--navy); line-height: 1.2; }
  .act-sub  { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-weight: 300; }

  .panel-photo {
    margin: 16px 12px 12px;
    border-radius: 10px;
    height: 120px;
    background: linear-gradient(140deg, #8aabb5, #5c8494);
    display: flex; align-items: flex-end;
    padding: 10px 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .panel-photo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(20,35,45,.45) 0%, transparent 60%);
  }
  .panel-photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .photo-label {
    font-size: 11px;
    color: rgba(255,255,255,.45);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    position: relative;
    z-index: 1;
  }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    .map-wrap {
      height: 42vh;
    }
    .panel {
      position: fixed;
      top: auto;
      bottom: 0; left: 0; right: 0;
      width: 100%;
      border-radius: 20px 20px 0 0;
      max-height: 65vh;
      transform: translateY(0);
    }
    .panel.hidden {
      transform: translateY(100%);
      opacity: 1;
    }
    .mobile-village-list {
      display: block;
    }
  }
  @media (min-width: 769px) {
    .mobile-village-list { display: none; }
  }
  .mobile-village-list {
    display: none;
    background: var(--bg);
    padding: 16px 20px 40px;
  }
  .mobile-village-list h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; font-weight: 600;
    color: var(--navy);
    margin-bottom: 12px;
    padding-top: 4px;
  }
  .mvl-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0;
    border-bottom: 0.5px solid var(--border);
    cursor: pointer;
  }
  .mvl-name { font-size: 14px; font-weight: 500; color: var(--navy); }
  .mvl-sub  { font-size: 11px; color: var(--text-muted); font-weight: 300; margin-top: 2px; }
  .mvl-arrow { color: var(--gold); opacity: .7; }
</style>
</head>
<body data-page="explore">

</div>

function openVillage(id) {
  const v = villages[id];
  if (!v) return;

  panelName.textContent = v.name;
  panelDesc.textContent = (typeof currentLang !== "undefined" && currentLang === "id") ? v.desc_id : v.desc_en;

  if (v.contact) {
    let html = '';
    if (v.contact.url) {
      html += `<a class="contact-btn" href="${v.contact.url}" target="_blank" rel="noopener">
        <i data-lucide="external-link" style="width:13px;height:13px"></i>${v.contact.label}
      </a>`;
    }
    if (v.contact.phone) {
      html += `<a class="contact-btn" href="https://wa.me/${v.contact.phone.replace(/\D/g,'')}" target="_blank" rel="noopener">
        <i data-lucide="message-circle" style="width:13px;height:13px"></i>WhatsApp
      </a>`;
    }
    panelContact.innerHTML = html;
    panelContact.style.display = 'block';
  } else {
    panelContact.innerHTML = '';
    panelContact.style.display = 'none';
  }

  const villagesWithPage = ['go', 'waifoi', 'warimak', 'kalitoko', 'warsambin', 'mumes'];
  if (villagesWithPage.includes(id)) {
    const moreBtn = document.getElementById('panel-more-btn');
    if (moreBtn) {
      moreBtn.href = `villages.html#${id}`;
      moreBtn.style.display = 'inline-flex';
    }
  } else {
    const moreBtn = document.getElementById('panel-more-btn');
    if (moreBtn) moreBtn.style.display = 'none';
  }

  actList.innerHTML = v.activities.map(a => `
    <div class="act-row">
      <div class="act-icon"><i data-lucide="${a.icon}" style="width:16px;height:16px"></i></div>
      <div>
        <div class="act-name">${a.name}</div>
        <div class="act-sub">${typeof currentLang !== 'undefined' && currentLang === 'id' ? a.sub_id : a.sub_en}</div>
      </div>
    </div>
  `).join('');

  if (v.photo) {
    panelPhoto.innerHTML = `<img src="${v.photo}" alt="${v.name}"><span class="photo-label" style="position:relative;z-index:1;font-size:11px;color:rgba(255,255,255,.45);font-style:italic;font-family:'Cormorant Garamond',serif;">${v.name}</span>`;
  } else {
    panelPhoto.innerHTML = `<span class="photo-label">Village photo</span>`;
  }

  panel.classList.remove('hidden');
  hint.style.opacity = '0';
  lucide.createIcons();

  document.querySelectorAll('.village-marker').forEach(m => m.classList.remove('active'));
  const el = document.getElementById('marker-' + id);
  if (el) el.classList.add('active');
}

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.add('hidden');
  hint.style.opacity = '1';
  document.querySelectorAll('.village-marker').forEach(m => m.classList.remove('active'));
});

// ── Place markers ────────────────────────────────────────────────────
Object.entries(villages).forEach(([id, v]) => {
  // Custom pin icon
  const icon = L.divIcon({
    className: '',
    html: `<div class="village-marker" id="marker-${id}">
             <div class="v-dot"></div>
             <div class="v-stem"></div>
             <div class="v-label">${v.name}</div>
           </div>`,
    iconSize: [14, 22],
    iconAnchor: [7, 22],
  });

  const marker = L.marker([v.lat, v.lon], { icon }).addTo(map);

  marker.on('click', () => openVillage(id));
});


// ── Mobile village list ───────────────────────────────────────────────
const mvl = document.getElementById('mobile-village-list');
if (mvl) {
  Object.entries(villages).forEach(([id, v]) => {
    const item = document.createElement('div');
    item.className = 'mvl-item';
    item.innerHTML = `<div><div class="mvl-name">${v.name}</div></div><div class="mvl-arrow"><i data-lucide="chevron-right" style="width:16px;height:16px"></i></div>`;
    item.addEventListener('click', () => {
      map.setView([v.lat, v.lon], 13);
      openVillage(id);
    });
    mvl.appendChild(item);
  });
}

// ── Init ─────────────────────────────────────────────────────────────
lucide.createIcons();

// ── Deko markers ─────────────────────────────────────────────────────

// Kalibiru
L.marker([-0.2988573, 130.9339812], { icon: L.divIcon({
  className: '',
  html: '<div class="deko-marker" style="position:relative;display:flex;align-items:center;">' +
        '<div class="deko-dot"></div>' +
        '<div class="deko-label">Kalibiru</div></div>',
  iconSize: [8, 8], iconAnchor: [4, 4]
}), interactive: false }).addTo(map);

// Gunung Nok
L.marker([-0.118500, 130.803500], { icon: L.divIcon({
  className: '',
  html: '<div class="deko-marker" style="position:relative;display:flex;align-items:flex-end;">' +
        '<div class="deko-mountain"></div>' +
        '<div class="deko-label" style="top:-14px;">Gunung Nok 958m</div></div>',
  iconSize: [30, 42], iconAnchor: [15, 42]
}), interactive: false }).addTo(map);

// Snorkel symbol
L.marker([-0.04973, 130.60824], { icon: L.divIcon({
  className: '',
  html: '<div class="deko-marker" style="position:relative;display:flex;align-items:center;">' +
        '<div class="deko-snorkel" style="font-size:32px;">🤿</div></div>',
  iconSize: [36, 36], iconAnchor: [18, 18]
}), interactive: false }).addTo(map);

</script>
<script src="header.js"></script>
<script>
  // Re-render open panel when language changes
  let _currentVillageId = null;
  const _origOpenVillage = openVillage;
  window.openVillage = function(id) {
    _currentVillageId = id;
    _origOpenVillage(id);
  };
  document.addEventListener('DOMContentLoaded', () => {
    const origSetLang = window.setLang;
    window.setLang = function(lang) {
      origSetLang(lang);
      if (_currentVillageId && !panel.classList.contains('hidden')) {
        _origOpenVillage(_currentVillageId);
      }
    };
  });
</script>
</body>
</html>
