<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourist Activities of Mayalibit Bay · mayalibit.com</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
</head>
<body>

<header>
  <div class="logo">mayalibit<span>.com</span></div>
  <div class="tag">Reef Guardian e.V.</div>
</header>

<div class="map-outer">
  <div class="map-container">
    <img src="mayalibit-map.png" alt="Tourist Activities of Mayalibit Bay">

    <!--
    =====================================================
    HOTSPOT POSITIONS
    left% = horizontal center of the map pin
    top%  = bottom tip of the map pin
    Adjust these values if a hotspot feels off.
    =====================================================
    -->

    <div class="hotspot" style="left:36.5%; top:24.5%" data-loc="go"></div>
    <div class="hotspot" style="left:27.8%; top:36.5%" data-loc="kabilol"></div>
    <div class="hotspot" style="left:51.8%; top:29.5%" data-loc="waifoi"></div>
    <div class="hotspot" style="left:38.8%; top:43.5%" data-loc="beo"></div>
    <div class="hotspot" style="left:23.2%; top:46.0%" data-loc="arawai"></div>
    <div class="hotspot" style="left:54.5%; top:44.0%" data-loc="warimak"></div>
    <div class="hotspot" style="left:62.8%; top:65.0%" data-loc="kalitoko"></div>
    <div class="hotspot" style="left:72.0%; top:78.5%" data-loc="warsambin"></div>
    <div class="hotspot" style="left:73.2%; top:89.5%" data-loc="lopintol"></div>
    <div class="hotspot" style="left:88.5%; top:84.5%" data-loc="mumes"></div>
  </div>
  <div class="hint">↑ Hover über einen Ort für Aktivitäten · Hover over a village for activities</div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-name" id="tt-name"></div>
  <div class="tooltip-desc" id="tt-desc"></div>
  <div id="tt-activities"></div>
</div>

<script>
/*
  =====================================================
  ORTSDATEN – hier kannst du alles bearbeiten!

  Für jeden Ort:
  - name: Ortsname (wird im Popup angezeigt)
  - desc: Beschreibung des Ortes (1-3 Sätze) – einfach Text eintragen
  - activities: Liste der Aktivitäten mit Icon, Name und Ambel/Indonesisch

  Icons: 🏡 🤿 🏊 🥾 🥁 🔭 🦜
  =====================================================
*/
const data = {
  go: {
    name: "Go",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  kabilol: {
    name: "Kabilol",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  waifoi: {
    name: "Waifoi",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay",          sub: "Nowtato · Homestay" },
      { icon: "🦜", name: "Bird Watching",      sub: "Tem mani · Pengamatan burung" },
      { icon: "🥾", name: "Hiking",             sub: "Sa · Lintas alam" },
      { icon: "🥁", name: "Cultural Heritage",  sub: "Le imtolon · Warisan budaya" }
    ]
  },
  beo: {
    name: "Beo",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  arawai: {
    name: "Arawai",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay",   sub: "Nowtato · Homestay" },
      { icon: "🔭", name: "Viewpoint",  sub: "Iyamunta tem · Gardu Pandang" }
    ]
  },
  warimak: {
    name: "Warimak",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay",      sub: "Nowtato · Homestay" },
      { icon: "🦜", name: "Bird Watching", sub: "Tem mani · Pengamatan burung" },
      { icon: "🥾", name: "Hiking",        sub: "Sa · Lintas alam" }
    ]
  },
  kalitoko: {
    name: "Kalitoko",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  },
  warsambin: {
    name: "Warsambin",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay",             sub: "Nowtato · Homestay" },
      { icon: "🏊", name: "Swimming – Kali Biru", sub: "Hla · Berenang" }
    ]
  },
  lopintol: {
    name: "Lopintol",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay",   sub: "Nowtato · Homestay" },
      { icon: "🤿", name: "Snorkeling", sub: "Hlanaron · Snorkeling" }
    ]
  },
  mumes: {
    name: "Mumes",
    // ↓ Beschreibung hier eintragen:
    desc: "",
    activities: [
      { icon: "🏡", name: "Homestay", sub: "Nowtato · Homestay" }
    ]
  }
};

/* =====================================================
   Ab hier nichts ändern
   ===================================================== */
const tooltip  = document.getElementById('tooltip');
const ttName   = document.getElementById('tt-name');
const ttDesc   = document.getElementById('tt-desc');
const ttAct    = document.getElementById('tt-activities');

document.querySelectorAll('.hotspot').forEach(hs => {
  hs.addEventListener('mouseenter', function(e) {
    const loc = data[this.dataset.loc];
    if (!loc) return;
    ttName.textContent = loc.name;
    ttDesc.textContent = loc.desc;
    ttAct.innerHTML = loc.activities.map(a => `
      <div class="tooltip-activity">
        <div class="act-icon">${a.icon}</div>
        <div class="act-text">
          <strong>${a.name}</strong>
          <small>${a.sub}</small>
        </div>
      </div>
    `).join('');
    tooltip.classList.add('visible');
    move(e);
  });
  hs.addEventListener('mousemove', move);
  hs.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
});

function move(e) {
  const w = tooltip.offsetWidth  || 250;
  const h = tooltip.offsetHeight || 160;
  let x = e.clientX + 18;
  let y = e.clientY - 20;
  if (x + w > window.innerWidth  - 8) x = e.clientX - w - 18;
  if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}
</script>
</body>
</html>
